# Default value: 4
# Acceptable value range: From 0 to 10
Quest Priority = 4

## Priority for hideout checkmarks. Higher number = higher priority.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 10
Hideout Priority = 3

## Priority for wishlist checkmarks. Higher number = higher priority.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 0 to 10
Wishlist Priority = 2

## Priority for barter checkmarks. Higher number = higher priority.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 10
Barter Priority = 1

## Priority for craft checkmarks. Higher number = higher priority.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 10
Craft Priority = 0

[Quests]

## Show checkmark and tooltip for quests this item is needed for. When disabled, no quest checkmark or quest tooltip section is shown.
# Setting type: Boolean
# Default value: true
Show Quest Checkmarks = false

## Consider future quests when checking which quests an item is required for. If false, behaves like vanilla.
# Setting type: Boolean
# Default value: true
Include Future Quests = false

## Show the number of prerequisite quests needed before each quest becomes available. Quests are sorted by prerequisite count with color coding: Green (0 prereqs), Yellow (1-9), Gray (10+).
# Setting type: Boolean
# Default value: true
Show Prerequisite Count = false

## When enabled, quest checkmarks will appear on items even if they aren't found in raid. Useful if your SPT is configured to accept non-FIR items for quest turn-ins.
# Setting type: Boolean
# Default value: false
Show Quest Checkmarks for Non-FIR Items = false

## When enabled, quest checkmarks only appear for quests that REQUIRE the item to be Found-in-Raid. Quests that accept non-FiR items (e.g. Ragman's Hot Delivery) won't show a checkmark. This is about whether the QUEST requires FiR; it is separate from 'Show Quest Checkmarks for Non-FIR Items', which is about whether YOUR stored item is FiR.
# Setting type: Boolean
# Default value: false
Only Show FiR-Required Quests = false

