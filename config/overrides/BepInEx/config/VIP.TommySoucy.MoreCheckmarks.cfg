[Hideout]

## Show checkmark and tooltip for hideout areas this item is needed for. When disabled, no hideout checkmark or 'Needed for area' tooltip section is shown.
# Setting type: Boolean
# Default value: true
Show Hideout Checkmarks = false

## When TRUE, shows fulfilled checkmark when AT LEAST ONE hideout module can be upgraded. When FALSE, shows fulfilled only when ALL modules can be upgraded.
# Setting type: Boolean
# Default value: true
Fulfilled Any Can Be Upgraded = false

## Show requirements for future hideout module levels instead of only the next one.
# Setting type: Boolean
# Default value: true
Show Future Module Levels = false

## When enabled, hideout requirements only drive the checkmark for items that are Found In Raid (FIR). Non-FIR items will not get a checkmark from hideout needs (though quests, wishlist, barters, or crafts can still show one). The 'Needed for area' tooltip lines are still shown.
# Setting type: Boolean
# Default value: true
Only Show Hideout Checkmark On FIR Items = false

