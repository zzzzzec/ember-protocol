## Settings file was created by plugin Drexira.DragonDen.Hitmarker v1.0.2
## Plugin GUID: Drexira.DragonDen.Hitmarker

[1. Hitmarker]

## Toggle the hitmarker when you hit an enemy.
# Setting type: Boolean
# Default value: true
Show Hitmarker = false

## Cross draws plus, X draws angled lines, Image uses a PNG from the UI folder.
# Setting type: HitmarkerStyle
# Default value: Image
# Acceptable values: Cross, X, Image
Hitmarker Style = Image

## PNG file name inside the UI folder.
# Setting type: String
# Default value: Hitmarker.png
Hitmarker: Normal Hit = Hitmarker.png

## PNG file for headshot marker.
# Setting type: String
# Default value: Hitmarker_Headshot.png
Hitmarker: Headshot Hit = Hitmarker_Headshot.png

## PNG file for kill marker.
# Setting type: String
# Default value: Hitmarker_Kill.png
Hitmarker: Kill Hit = Hitmarker_Kill.png

## Color for kill marker.
# Setting type: Color
# Default value: FF0000FF
Color: Kill = FF0000FF

## Color for normal hits.
# Setting type: Color
# Default value: 00BF00FF
Color: Normal Hit = 00BF00FF

## Color for armor hits.
# Setting type: Color
# Default value: 00BFFFFF
Color: Armor Hit = 00BFFFFF

## Color for headshots.
# Setting type: Color
# Default value: FF4040FF
Color: Headshot = FF4040FF

## If the hitmarker briefly scales on headshots.
# Setting type: Boolean
# Default value: true
Headshot Pulse Effect = true

## The size of the hitmarker lines or image in pixels.
# Setting type: Single
# Default value: 12
Size = 12

## Duration before the marker fades out in seconds.
# Setting type: Single
# Default value: 0.5
Visible Time = 0.5

## The opacity for the hitmarker.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Opacity = 1

[2. Damage Numbers]

## Toggle floating damage numbers next to hitmarker on hits.
# Setting type: Boolean
# Default value: false
Show Damage Numbers = false

## Font size of the damage text.
# Setting type: Int32
# Default value: 18
Font Size = 18

## Lifetime of each damage number in seconds.
# Setting type: Single
# Default value: 1.25
Visible Time = 1.25

## Pixels the text moves upward over its lifetime.
# Setting type: Single
# Default value: 30
Rise Distance = 30

## Tokens: {flesh} body damage, {armor} armor damage, {bp} body part.
# Setting type: String
# Default value: {flesh} ({armor})
Main Text Template = {flesh} ({armor})

## Add a semi-transparent box behind the damage numbers for readability.
# Setting type: Boolean
# Default value: false
Background Box = false

## If true, numbers appear where it hits on the target. If off-screen they clamp to the nearest edge.
# Setting type: Boolean
# Default value: true
Show At Hit Position = true

## Padding when clamping off-screen hits.
# Setting type: Single
# Default value: 0.04
# Acceptable value range: From 0 to 0.49
Edge Clamp Padding = 0.04

## Tag color used for labels such as Ricochet.
# Setting type: Color
# Default value: FFD940FF
Base Text Color = FFD940FF

[3. Audio]

## Global volume for sounds.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1
Master Volume = 0.6

## Play a sound on hit.
# Setting type: Boolean
# Default value: true
Play Sound On Hit = true

## Play a sound on headshot.
# Setting type: Boolean
# Default value: true
Play Sound On Headshot = true

## Play a sound on kill.
# Setting type: Boolean
# Default value: true
Play Sound On Kill = true

## Volume for hit sound.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1
Hit Sound Volume = 0.6

## Volume for headshot sound.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1
Headshot Sound Volume = 0.6

## Volume for kill sound.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1
Kill Sound Volume = 0.6

## WAV file in the Sounds folder.
# Setting type: String
# Default value: Hitmarker1.wav
Hit Sound File Name = Hitmarker1.wav

## WAV file in the Sounds folder.
# Setting type: String
# Default value: Hitmarker2.wav
Headshot Sound File Name = Hitmarker2.wav

## WAV file in the Sounds folder.
# Setting type: String
# Default value: Kill.wav
Kill Sound File Name = Kill.wav

[4. Advanced]

## Log hit and kill events to the BepInEx console.
# Setting type: Boolean
# Default value: false
Debug Log Output = false

