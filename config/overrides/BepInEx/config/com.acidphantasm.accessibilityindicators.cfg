## Settings file was created by plugin acidphantasm-AccessibilityIndicators v2.0.1
## Plugin GUID: com.acidphantasm.accessibilityindicators

[1. General]

## Enable or disable this mod.
# Setting type: Boolean
# Default value: true
Enable Mod = false

## If you enjoy Swedish Coffee, this toggle is for you. Toggle showing indicators for teammates.
# Setting type: Boolean
# Default value: false
Show Teammates = false

## Toggles normalizing the size of the indicator based on distance. Disabled means each indicator type will size respective to it's configured max distance, enabled means all indicator types will be the same size at the same distance.
# Setting type: Boolean
# Default value: true
Normalize Indicator Size = true

## Indicator will be it's largest when the sound made is this close (or closer) to you.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 24
Min Normalized Distance = 1

## Indicator will be it's smallest when the sound made is this far (or further) from you.
# Setting type: Single
# Default value: 75
# Acceptable value range: From 25 to 300
Max Normalized Distance = 75

## Indicator offset for the UI, higher value moves it further from the center of screen - lower moves closer to center.
# Setting type: Single
# Default value: 25
# Acceptable value range: From -50 to 100
Indicator Offset = 25

